# Always use a unique project name; no production/existing volumes or ports.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["/bin/sh", "/etc/srez/seaweedfs-entrypoint.sh"]
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-s3.allowedOrigins=http://127.0.0.1:5173,http://localhost:5173", "-bucket=srez-media"]
    environment:
      AWS_ACCESS_KEY_ID: "${SREZ_S3_ACCESS_KEY:?}"
      AWS_SECRET_ACCESS_KEY: "${SREZ_S3_SECRET_KEY:?}"
    ports: ["127.0.0.1::8333"]
    volumes: ["media_test:/data", "./deploy/seaweedfs-entrypoint.sh:/etc/srez/seaweedfs-entrypoint.sh:ro"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q '403'"]
      interval: 2s
      timeout: 3s
      retries: 60
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srez
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: srez
    ports: ["127.0.0.1::5432"]
    volumes: ["postgres_test:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srez -d srez"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  media_test:
  postgres_test:
