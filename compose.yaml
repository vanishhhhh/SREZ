services:
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://srez:srez_dev@db:5432/srez?sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srez
      POSTGRES_PASSWORD: srez_dev
      POSTGRES_DB: srez
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U srez -d srez"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
