services:
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://srez:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/srez?sslmode=disable"
      SREZ_DEV_CATALOG_WRITE: "${SREZ_DEV_CATALOG_WRITE:-false}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srez
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?copy .env.example to .env}"
      POSTGRES_DB: srez
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U srez -d srez"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
