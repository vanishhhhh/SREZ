services:
  app:
    build: .
    environment:
      DATABASE_URL: "postgres://srez:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/srez?sslmode=disable"
      SREZ_JWT_KEY: "${SREZ_JWT_KEY:?generate independent JWT key in .env}"
      SREZ_CSRF_KEY: "${SREZ_CSRF_KEY:?generate independent CSRF key in .env}"
      SREZ_JWT_ISSUER: "${SREZ_JWT_ISSUER:-srez}"
      SREZ_JWT_AUDIENCE: "${SREZ_JWT_AUDIENCE:-srez-api}"
      SREZ_PUBLIC_ORIGIN: "${SREZ_PUBLIC_ORIGIN:-http://127.0.0.1:8080}"
      SREZ_AUTH_LOCAL_HTTP: "${SREZ_AUTH_LOCAL_HTTP:-false}"
      SREZ_AUTH_ATTEMPTS: "${SREZ_AUTH_ATTEMPTS:-10}"
      SREZ_AUTH_HASH_WORKERS: "${SREZ_AUTH_HASH_WORKERS:-2}"
      SREZ_TRUSTED_PROXIES: "${SREZ_TRUSTED_PROXIES:-}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srez
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?copy .env.example to .env}"
      POSTGRES_DB: srez
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U srez -d srez"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
