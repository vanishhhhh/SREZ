pid /tmp/srez-nginx.pid;
worker_processes 2;
# Capability URLs must never enter request/error logs. Safe status logging below
# remains enabled; backend logs provide sanitized application diagnostics.
error_log /dev/null;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe 'status=$status bytes=$body_bytes_sent time=$request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream srez_api {
        zone srez_api 64k;
        server app:8080 resolve;
    }
    map $uri $srez_cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        default "no-store";
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 6m;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control $srez_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        location /api/ {
            proxy_pass http://srez_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 60s;
        }
        location /media/ {
            proxy_pass http://srez_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_request_buffering off;
            proxy_read_timeout 60s;
        }
        location ~ ^/(verify-email|reset-password)$ {
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files /index.html =404;
        }
        location /assets/ {
            gzip on;
            gzip_vary on;
            gzip_types text/css text/javascript application/javascript;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
